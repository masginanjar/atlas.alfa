<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#141B34;--mute:#5E6380;--bg:#F3F4F9;--line:#DADDE8;--line2:#D9DBE7;--soft:#EEF0F5}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.4}
button,input,select{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #4169E1;outline-offset:2px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
h2{margin:0;font-size:15px;font-weight:700}
#app{display:flex;min-height:100vh;align-items:stretch}
.nav{width:232px;flex-shrink:0;background:#fff;border-right:1px solid #E7E8F0;padding:24px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--mute)}
.navlist{display:flex;flex-direction:column;gap:4px}
.navlist button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:14px;font-weight:600;text-align:left;white-space:nowrap}
.navlist button[aria-current=page]{background:var(--ink);color:#fff}
.navnote{margin-top:auto;padding:12px;border-radius:16px;background:var(--bg);font-size:12px;color:var(--mute)}
main{flex:1;min-width:0;padding:24px clamp(12px,2vw,24px) 48px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.pad{padding:16px}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grow{flex:1 1 0;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap}
.btn.dark{border:0;background:var(--ink);color:#fff}
.btn.blue{border:0;background:#DFF1FB;color:#0B5C8A}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px}
.ib{width:44px;height:44px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:hover{background:var(--bg)}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:#E3F4E8;color:#17693A}.c-cek{background:#FFF1C7;color:#6B4E00}.c-salah{background:#FDE5E2;color:#9B2318}.c-kosong{background:#ECEEF4;color:#4A5070}.c-manual{background:#E6E4FB;color:#3F3497}.c-biru{background:#DFF1FB;color:#0B5C8A}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.steps button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border-radius:22px;border:1px solid var(--line2);background:#fff;color:var(--mute);font-size:13px;font-weight:700}
.steps button[aria-current=step]{background:var(--ink);border-color:var(--ink);color:#fff}
.steps i{font-style:normal;width:22px;height:22px;border-radius:11px;background:rgba(120,125,150,.18);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:#3F4563}
.inp{min-height:44px;width:100%;border:1px solid var(--line2);border-radius:10px;padding:0 10px;font-size:14px;color:var(--ink);background:#fff}
select.inp{border-radius:12px}
.drop{border:2px dashed #B9BDD0;border-radius:16px;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:#FAFBFD}
.drop.over{background:#EAF3FB;border-color:#0B5C8A}
.thumb{width:96px;height:64px;flex-shrink:0;border-radius:8px;border:1px solid var(--line2);background:#EEF0F6;object-fit:contain}
.pg{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--soft)}
.bar{height:6px;border-radius:3px;background:#E7E8F0;overflow:hidden}
.bar>div{height:100%;background:var(--ink);width:0}
.small{font-size:12px;color:var(--mute)}
.split{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.srcbox{flex:1 1 320px;min-width:0;position:sticky;top:12px;overflow:hidden}
.srcview{background:#EEF0F6;padding:12px;max-height:70vh;overflow:auto}
.srcinner{position:relative;width:100%}
.ung{display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto;width:100%}
.ungbox{padding:12px;display:flex;flex-direction:column;gap:10px}
.dropx{flex-direction:row!important;align-items:center;justify-content:flex-start;gap:14px;padding:14px 16px!important;text-align:left;flex-wrap:wrap}
.dropx .dropic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#EEF1FA;color:#2B3A5C;flex:none}
.dropx .droptx{display:flex;flex-direction:column;gap:2px;flex:1 1 220px;min-width:0}.dropx .droptx b{font-size:15px}.dropx .droptx .small{font-size:13px}
.ungbox.besar .dropx{flex-direction:column!important;align-items:center;justify-content:center;text-align:center;padding:44px 16px!important;gap:12px}.ungbox.besar .dropx .droptx{flex:none;align-items:center}.ungbox.besar .dropx .droptx b{font-size:18px}.ungbox.besar .dropx .dropic{width:60px;height:60px;border-radius:16px}
.unginfo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:0 4px}.unginfo .jn{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}.unginfo .cth{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.lkb{font:inherit;font-size:13px;font-weight:600;color:#2F4BC6;background:none;border:0;padding:6px 2px;min-height:32px;cursor:pointer;text-decoration:underline}
@media (max-width:700px){.unginfo .cth{margin-left:0}.lkb{min-height:44px}.dropx .btn{flex:1 1 100%}.unghead .btn{flex:1 1 auto}}
.dvwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}.zoombar{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;gap:2px;padding:3px;border-radius:9px;background:rgba(255,255,255,.94);box-shadow:0 1px 6px rgba(20,27,52,.22)}.zoombar .mb{min-width:28px;font-size:14px}.zoombar #zoomlbl{min-width:48px;font-size:12px}.docview.geser{cursor:grab}.docview.menggeser{cursor:grabbing;user-select:none}.docview.pilih.geser{cursor:crosshair}
.srcinner canvas{display:block;width:100%;height:auto;border-radius:8px}
.hl{position:absolute;border:2px solid #D9534A;background:rgba(217,83,74,.14);border-radius:4px;pointer-events:none;display:none}
.raw{margin:0;padding:12px;white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:70vh;overflow:auto;background:#FAFBFD}
.tbl{flex:2.4 1 560px;min-width:0;overflow:hidden}
.g4{display:grid;grid-template-columns:132px minmax(0,1.15fr) minmax(0,1.15fr) minmax(96px,.7fr);gap:0 10px;align-items:center}
.thead{padding:9px 14px;background:#E6E8F2;color:#3F4563;font-size:12px;font-weight:600}
.frow{min-height:52px;padding:4px 14px;border-top:1px solid #F1F2F7}
.frow .lab{font-size:13px;font-weight:600;color:#3F4563}
.frow .mini{display:none;font-size:11px;font-weight:600;color:var(--mute)}
.st{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.okmark{color:#17693A;display:inline-flex}
.tick{min-height:32px;padding:0 8px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:12px;font-weight:700;color:var(--ink)}
.sheetwrap{background:#E9EBF3;padding:16px;overflow:auto;display:flex;justify-content:center}
.sheet{width:794px;min-height:1123px;padding:96px;background:#fff;color:#000;font-family:'Times New Roman',Times,serif;font-size:16px;line-height:1.2;transform-origin:top left}
.sheet .kr{display:grid;grid-template-columns:172px 10px minmax(0,1fr);align-items:start}
.radio{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border-radius:12px;border:1px solid var(--line2);background:#fff}
.radio.on{border-color:var(--ink);background:var(--bg)}
.radio input,.cekbox input{width:18px;height:18px;accent-color:var(--ink)}
.ck{display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.ck i{font-style:normal;width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:800}
.cekbox{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;background:var(--bg);font-weight:600}
.g3{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1.2fr) 56px;gap:0 10px;align-items:center}
.joblist .g5{display:grid;grid-template-columns:minmax(0,1.4fr) 100px 150px 150px 150px;gap:0 10px;align-items:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;max-width:90vw;display:none;z-index:50}
code{font:12px ui-monospace,Menlo,Consolas,monospace;background:#FFF1C7;color:#5A4200;padding:1px 4px;border-radius:4px}
@media (max-width:900px){
 #app{flex-direction:column}
 .nav{width:100%;height:auto;position:static;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid #E7E8F0}
 .brand span,.navnote{display:none}.brand b{font-size:16px;white-space:nowrap}
 .navlist{flex-direction:row}
 main{padding:14px 12px 40px}
 h1{font-size:20px}
 .srcbox{position:static}
 .srcview{max-height:46vh}
 .thead{display:none}
 .g4{grid-template-columns:minmax(0,1fr);gap:6px}
 .frow{padding:12px 14px}
 .frow .mini{display:block}
 .frow .tetap{display:none}
 .g3{grid-template-columns:minmax(0,1fr) 56px}
 .g3 .gk{grid-column:1/-1}
 .g3.thead{display:none}
 .joblist .g5{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px}
 .inp{font-size:16px}
}

/* ATLAS: tampil di dalam ATLAS (?embed=1) — menu jadi baris atas, judul ATLAS tidak dobel */
body.embed #app{flex-direction:column;min-height:0}
body.embed .nav{width:100%;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid #E7E8F0}
body.embed .brand,body.embed .navnote{display:none}
body.embed .navlist{flex-direction:row}
body.embed main{padding:14px 12px 40px}

.thumb{border-radius:10px;width:104px;height:68px}

/* ===== Tata letak sama persis dengan kanvas desain (15 Nov 2026) ===== */
#app{display:block;max-width:1360px;margin:0 auto;padding:24px;min-height:0}
main{padding:0;margin-top:20px}
.wrap{gap:20px}
.tophead{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.tophead .logo{width:48px;height:48px;border-radius:14px;background:#141B34;display:flex;align-items:center;justify-content:center;flex:none}
.tophead .htext{flex:1 1 240px;display:flex;flex-direction:column;gap:2px}
.tophead h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.tophead p{margin:0;font-size:15px;color:#5B6178}
.vcard{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #E3E6EF;border-radius:16px;padding:10px 16px}
.vcard .dot{width:10px;height:10px;border-radius:99px;flex:none}
.vcard .vb{display:flex;flex-direction:column;gap:6px;min-width:220px}
.vcard .vt{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.vcard .vt b{font-weight:600}.vcard .vt span{color:#5B6178}
.vcard .track{height:6px;border-radius:99px;background:#E8EBF3}.vcard .track>div{height:6px;border-radius:99px}
.vcard small{font-size:12px;color:#5B6178}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tabs button{min-height:46px;padding:0 18px;border:1px solid #E3E6EF;border-radius:12px;background:#fff;color:#141B34;font-size:15px;font-weight:500}
.tabs button[aria-current=page]{background:#141B34;border-color:#141B34;color:#fff;font-weight:600}
.stepper{list-style:none;margin:0;padding:16px 20px;background:#fff;border:1px solid #E3E6EF;border-radius:18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stepper button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0;border:0;background:transparent;text-align:left;color:#141B34}
.stepper button:disabled{opacity:1;cursor:default}
.stepper .n{width:36px;height:36px;flex:none;border-radius:99px;background:#EEF0F6;color:#5B6178;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center}
.stepper .done .n{background:#E3F5EC;color:#136C3F}
.stepper .now .n{background:#141B34;color:#fff;font-weight:700}
.stepper .t{display:flex;flex-direction:column;min-width:0}
.stepper .t b{font-size:15px;font-weight:600}
.stepper .todo .t b{font-weight:500;color:#5B6178}
.stepper .now .t b{font-weight:700}
.stepper .t span{font-size:13px;color:#5B6178;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper .t span.warn{color:#8A5A00}
.ptitle{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.psub{margin:0;font-size:15px;color:#5B6178}
.two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.c20{background:#fff;border:1px solid #E3E6EF;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.c20 h2{font-size:18px;font-weight:600}
.hint{display:flex;gap:10px;align-items:flex-start;background:#FFF6DE;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.5;color:#6B4600}
.docview{position:relative;background:#EEF2FB;border-radius:16px;overflow:auto;max-height:62vh}
.docview{padding:12px}
.docview .srcinner{position:relative}
.docview.pilih .srcinner{cursor:crosshair}
.selbox{position:absolute;border:2px dashed #2F4BC6;background:rgba(47,75,198,.12);pointer-events:none}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:#5B6178;padding-left:182px}
.meta i{font-style:normal;color:#C0C5D6}.meta code{background:#EEF0F6;color:#2B3A5C}

.cand,.mini-btn{min-height:36px;padding:0 10px;border-radius:10px;border:1px solid #C9D3F5;background:#F3F6FF;color:#23358F;font-size:13px;font-weight:600}
.cand small{font-weight:500;color:#5B6178}
.mini-btn{border-color:#E3E6EF;background:#fff;color:#141B34}
.fr.sel{outline:2px solid #2F4BC6;outline-offset:2px}
.qbox{display:flex;flex-direction:column;gap:6px;background:#F6F7FB;border-radius:14px;padding:12px 14px;font-size:14px;color:#2B3A5C}
.qbox b{font-weight:600}
#potongan{max-width:100%;border-radius:10px;border:1px solid #E3E6EF;background:#fff}
@media (max-width:900px){.meta{padding-left:0}.cand,.mini-btn{min-height:44px}}
.hl{border-color:#E0A800;background:rgba(242,201,76,.28)}
.frows{display:flex;flex-direction:column;gap:8px}

.fhead{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:0 12px;font-size:12px;font-weight:600;color:#5B6178;text-transform:uppercase;letter-spacing:.04em}

.btn.lg{min-height:48px;padding:0 22px}
.seg{display:flex;background:#EEF0F6;border-radius:12px;padding:4px}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:#2B3A5C;font-size:14px;font-weight:500}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E3E6EF;border-radius:12px;padding:0 14px;min-height:48px}
.search input{flex:1;border:0;outline:0;font:400 16px Inter,system-ui,sans-serif;background:transparent;min-height:44px;color:#141B34}
.pill{min-height:48px;padding:0 16px;border-radius:99px;border:1px solid #E3E6EF;background:#fff;color:#141B34;font-size:14px;font-weight:500}
.pill[aria-pressed=true]{border-color:#141B34;background:#141B34;color:#fff;font-weight:600}
.tblbox{background:#fff;border:1px solid #E3E6EF;border-radius:20px;overflow-x:auto}
.tblbox table{width:100%;border-collapse:collapse;min-width:820px;font-size:15px}
.tblbox th{text-align:left;padding:14px 12px;font-size:13px;font-weight:600;color:#5B6178;text-transform:uppercase;letter-spacing:.04em}
.tblbox th:first-child,.tblbox td:first-child{padding-left:20px}.tblbox th:last-child,.tblbox td:last-child{padding-right:20px;text-align:right}
.tblbox td{padding:14px 12px;border-top:1px solid #EEF0F6}
.ficon{width:40px;height:40px;border-radius:10px;background:#EEF2FB;display:flex;align-items:center;justify-content:center;flex:none;color:#23358F}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.gcard{background:#fff;border:1px solid #E3E6EF;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.gcard .src{font-size:17px;font-weight:600}
.gcard .en{display:flex;align-items:center;gap:8px;color:#23358F}
.gcard .en input{flex:1;min-width:0;border:1px solid transparent;border-radius:10px;padding:6px 8px;margin-left:-8px;font:600 17px Inter,system-ui,sans-serif;color:#23358F;background:transparent}
.gcard .en input:hover,.gcard .en input:focus{border-color:#E3E6EF;background:#FAFBFD}
.tcard{background:#fff;border:1px solid #E3E6EF;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.tprev{background:#EEF0F6;border-radius:12px;padding:16px;height:170px;box-sizing:border-box;display:flex;justify-content:center}
.tpage{width:118px;background:#fff;border-radius:4px;padding:12px 10px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
.tpage i{display:block;height:4px;border-radius:2px;background:#DDE3EE}
.sheetwrap{background:#EEF0F6;border-radius:16px}
@media (max-width:900px){
 #app{padding:14px 12px}
 .stepper{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto}
 .fr,.fhead{grid-template-columns:minmax(0,1fr)}
 .fhead{display:none}.fr .mini{display:block}.fr .st{justify-content:flex-start}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .cards3{grid-template-columns:minmax(0,1fr)}
 .cards4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .vcard .vb{min-width:0;flex:1}.vcard{flex:1 1 100%}
}
body.embed .nav,body.embed .brand{display:none}
body.embed main{padding:0}
body.embed #app{padding:16px}

.ovl{position:fixed;inset:0;z-index:50;background:rgba(20,27,52,.42);display:flex;align-items:center;justify-content:center;padding:12px}
.dlg{position:relative;width:min(1180px,100%);max-height:94dvh;overflow:auto;background:#F4F5F9;border-radius:10px;box-shadow:0 18px 50px rgba(20,27,52,.28);padding:12px 14px 14px}
.dlgh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.dlgh b{font-size:14px;font-weight:600}
.tbtn{font:inherit;font-size:12.5px;font-weight:600;min-height:28px;padding:0 10px;border-radius:6px;border:1px solid #CDD2E0;background:#fff;color:#141B34;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tbtn.dark{background:#141B34;border-color:#141B34;color:#fff}.tbtn:disabled{opacity:.5;cursor:not-allowed}.tbtn[aria-pressed=true]{background:#EDF0FD;border-color:#2F4BC6}
.ws{display:flex;flex-direction:column;gap:7px}
.tbar{display:flex;align-items:center;gap:6px;min-height:36px;flex-wrap:wrap}
.tbar .sep{width:1px;height:20px;background:#DDE1EC}.tbar .info{font-size:12px;color:#5B6178;display:flex;gap:4px;flex-wrap:wrap}.tbar .info .chip{font-size:11.5px;padding:1px 8px}
.tbar .kanan{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.p3{display:flex;flex-direction:column;gap:8px}
.pn{background:#fff;border:1px solid #DDE1EC;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pnh{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;flex:none;padding:0 10px;border-bottom:1px solid #DDE1EC;background:#FAFBFD;font-size:12px;color:#5B6178}
.pnh b{font-size:13px;font-weight:600;color:#141B34;white-space:nowrap}.pnh .kn{display:flex;align-items:center;gap:4px;min-width:0}
.pnh .ket{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb{font:inherit;font-size:12px;font-weight:600;min-width:26px;height:24px;padding:0 6px;border-radius:5px;border:1px solid #CDD2E0;background:#fff;color:#141B34;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.mb[aria-pressed=true]{background:#141B34;border-color:#141B34;color:#fff}.mb:disabled{opacity:.45;cursor:not-allowed}.mb svg{width:14px;height:14px}
.pnb{flex:1;min-height:0;overflow:auto}
.pnf{flex:none;min-height:26px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px;border-top:1px solid #DDE1EC;font-size:11.5px;color:#5B6178}
.pnf button.lk{font:inherit;font-size:11.5px;color:#2F4BC6;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.spl{display:none}
.r3{display:grid;grid-template-columns:18px 104px minmax(0,1fr);align-items:center;column-gap:8px;min-height:30px;padding:0 10px;border-top:1px solid #EEF0F6}
.r3:first-child{border-top:0}.r3.warn{background:#FFFDF3}.r3.sel{background:#EDF0FD;box-shadow:inset 3px 0 0 #2F4BC6}
.r3 .lb{font-size:12.5px;color:#5B6178;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r3 input{font:inherit;font-size:13.5px;font-weight:600;color:#141B34;width:100%;height:24px;border:1.5px solid transparent;border-radius:5px;background:transparent;padding:0 5px;min-width:0}
.r3 input:hover{border-color:#DDE1EC}.r3 input:focus{border-color:#2F4BC6;background:#fff;outline:0}.r3 input[readonly]{color:#3B4260;font-weight:500}
.g3{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;box-sizing:border-box}
.g3.ok{border-radius:99px;background:#E3F4EA;color:#14713F}.g3.cek{border-radius:4px;background:#FFE9A8;color:#6B4700}.g3.salah{border-radius:4px;background:#FBD5D0;color:#8E1B10}.g3.na{border-radius:99px;border:1.5px dashed #A8AEC2}
.detil{flex:none;border-top:1px solid #DDE1EC;background:#FAFBFD;padding:6px 10px;min-height:54px;max-height:132px;overflow:auto;font-size:12px}
.detil .meta{display:none;padding-left:0;font-size:12px}.detil .meta.on{display:flex}.detil .kos{color:#5B6178}
.detil .cand,.detil .mini-btn{min-height:26px;font-size:12px}
.ws .docview{flex:1;min-height:220px;max-height:none;border-radius:0;background:#E9ECF4;padding:10px}
.ws .cat3{flex:none;font-size:11.5px;line-height:1.4;padding:5px 10px;border-bottom:1px solid #DDE1EC;color:#3B4260;background:#F4F5FA}
.ws .cat3.merah{background:#FDECEC;color:#7A1F1F}
.ws .pot3{flex:none;border-top:1px solid #DDE1EC;padding:6px 10px;display:flex;align-items:center;gap:10px;font-size:11.5px;color:#5B6178;min-height:44px}
.ws .pot3 canvas{max-height:40px;max-width:100%;width:auto;border-radius:5px;background:#EEF2FB}
.ws pre.raw{flex:1;min-height:0;margin:0;border-radius:0;overflow:auto;font-size:12px}
@media (max-width:999px){.p3 .pn{flex:none!important}.pnb{overflow:visible}.r3{min-height:46px;grid-template-columns:18px 96px minmax(0,1fr)}.r3 input{font-size:16px;height:38px}.tbtn,.mb{min-height:44px}.mb{min-width:44px}.pn[data-pn="0"] .docview{max-height:46dvh}}

 .tabs button[aria-current=page]{background:transparent;color:#141B34;font-weight:600;box-shadow:inset 0 -2px 0 #141B34}
 #app>main{flex:1;min-height:0;overflow:auto;margin-top:0}
 .wrap{gap:10px;max-width:none}
 .ptitle{font-size:16px}.psub{font-size:12.5px}
 .c20{border-radius:8px;padding:12px 14px;gap:10px}
 #app>main.kerja{overflow:hidden}
 main.kerja .wrap{height:100%;max-width:none;margin:0;padding:0}

}

/* ---------- Template ---------- */
function checkTpl(bytes){
  const z=new PizZip(bytes);const f=z.file('word/document.xml');if(!f)throw new Error('Bukan file DOCX yang valid');const x=f.asText();
  const raw=new Set([...x.matchAll(/\{\{([^{}<]+)\}\}/g)].map(m=>m[1]));const plain=new Set();
  for(const p of x.split(/<\/w:p>/)){const t=p.replace(/<[^>]+>/g,'');for(const m of t.matchAll(/\{\{([^{}]+)\}\}/g))plain.add(m[1])}
  const all=[...plain];return{ok:all.filter(k=>raw.has(k)&&KEYS.includes(k)),pecah:all.filter(k=>!raw.has(k)),asing:all.filter(k=>raw.has(k)&&!KEYS.includes(k)),belum:KEYS.filter(k=>!plain.has(k)&&k!=='tanda_draf')};
}
function viewTpl(){
  const c=S.customTpl;
  const page=`<div class="tprev"><div class="tpage"><i style="height:6px;width:70%;margin:0 auto;background:#9FB2D1"></i><i style="width:50%;margin:0 auto 4px;background:#C8D3E6"></i><i style="width:90%"></i><i style="width:80%"></i><i style="width:86%"></i><i style="width:72%"></i><i style="width:90%"></i><i style="width:60%"></i><i style="height:14px;width:40%;margin-top:auto;align-self:flex-end;background:transparent;border:1px solid #C8D3E6;border-radius:3px"></i></div></div>`;
  const card=(nama,sub,siap,aksi)=>`<article class="tcard">${page}<div class="col" style="gap:4px;padding:0 4px"><b style="font-size:16px;font-weight:600">${nama}</b><span class="small">${sub}</span></div><div class="row" style="justify-content:space-between;padding:0 4px 2px"><span class="chip ${siap?'c-ok':'c-cek'}">${siap?'Siap dipakai':'Menyusul'}</span>${aksi||''}</div></article>`;
  const master=[['KTP — depan','A4 · Times New Roman 12 · '+TPL_VERSION,1,`<button type="button" class="btn sm" data-act="dltpl" data-t="depan">${ic(I.down,16)}Unduh</button>`],['KTP — depan + belakang','A4 · '+TPL_VERSION,1,`<button type="button" class="btn sm" data-act="dltpl" data-t="belakang">${ic(I.down,16)}Unduh</button>`],['Kartu Keluarga','A4 mendatar · tabel anggota · KK-EN v1',1],['Akta Kelahiran','A4 · kutipan · AKTA-EN v1',1],['Ijazah','A4 mendatar/tegak · baris demi baris, terjemahan usulan AI · IJAZAH-EN v1',1],['Transkrip Nilai','A4 · tabel mata kuliah, terjemahan usulan AI · TRANSKRIP-EN v1',1],['Buku Nikah','KUA · 2 buku',0],['Akta Perkawinan','Dukcapil',0]];
  return head('Template',`<button type="button" class="btn lg" data-act="pilihtpl">Unggah template Word</button>`,'Format terjemahan per jenis dokumen — dipilih otomatis sesuai hasil baca')+`
  <div class="cards4">${master.map(m=>card(...m)).join('')}</div>
  ${c?`<section class="c20" style="gap:8px"><h2>${esc(c.name)}</h2>
      <div class="row">${chip(c.r.ok.length+' placeholder siap','ok')}${c.r.pecah.length?chip(c.r.pecah.length+' terpecah','salah'):''}${c.r.asing.length?chip(c.r.asing.length+' tidak dikenal','salah'):''}${c.r.belum.length?chip(c.r.belum.length+' belum dipakai','cek'):''}</div>
      ${c.r.pecah.length?`<span class="small">Terpecah (ketik ulang di Word tanpa mengubah format): ${c.r.pecah.map(k=>'<code>{{'+esc(k)+'}}</code>').join(' ')}</span>`:''}
      ${c.r.asing.length?`<span class="small">Tidak dikenal: ${c.r.asing.map(k=>'<code>{{'+esc(k)+'}}</code>').join(' ')}</span>`:''}
      <b style="color:${c.usable?'#136C3F':'#9B2318'}">${c.usable?'Bisa dipakai di langkah Unduh (selama halaman ini terbuka).':'Belum bisa dipakai. Perbaiki dulu catatan merah.'}</b></section>`:''}
  <section class="c20" style="gap:10px"><h2>Placeholder untuk template Word sendiri</h2><span class="small">Ketik tiap placeholder sekali jalan, tanpa ganti format di tengahnya.</span><div class="row" style="gap:6px">${KEYS.map(k=>`<code>{{${k}}}</code>`).join('')}</div></section>`;
}

/* ---------- Render & aksi ---------- */
function render(){
  renderNav();const v=$('#view');const sy=window.scrollY;v.parentElement.classList.toggle('kerja',S.view==='proses'&&S.step>=2&&!!(curDoc()&&curDoc().fields));
  if(S.view==='proses'){if(S.cur>=S.docs.length)S.cur=Math.max(0,S.docs.length-1);if(S.step>1&&!S.docs.some(d=>d.fields))S.step=1;if(S.step>1&&curDoc()&&!curDoc().fields){const i=S.docs.findIndex(d=>d.fields);if(i>=0)S.cur=i}
    v.innerHTML=S.step===1?viewUnggah():S.step===2?viewPeriksa():viewPeriksa()+`<div class="ovl" id="ovl"><div class="dlg" role="dialog" aria-label="Pratinjau hasil"><div class="dlgh"><b>Pratinjau hasil &amp; unduh</b><button type="button" class="tbtn" data-act="step" data-s="2">Tutup (Esc)</button></div>${viewHasil()}</div></div>`;if(S.step>=2)afterPeriksa();if(S.step===3)fitSheet()}
  else if(S.view==='pekerjaan')v.innerHTML=viewPekerjaan();
  else if(S.view==='glosarium')v.innerHTML=viewGlos();

  window.scrollTo(0,sy);
}
function refreshStatus(key){const d=curDoc();const f=d.fields.find(x=>x.key===key);const c=$('#st-'+key);if(c)c.innerHTML=stCell3(f);const c2=$('#stt-'+key);if(c2)c2.innerHTML=stCell3(f);for(const id of ['#row-','#rowt-']){const rw=$(id+key);if(rw)rw.classList.toggle('warn',rowWarn(f))}const m=$('#meta-'+key);if(m){m.outerHTML=metaKolom(f);if(S.selField===key){const m2=$('#meta-'+key);if(m2)m2.classList.add('on')}}const ch=$('#chips');if(ch)ch.innerHTML=countChips(d);jadwalSimpan()}
